<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zotero · ChatGPT 翻译连接</title>
<style>
body{margin:0;background:#f4f5f3;color:#202821;font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:680px;margin:8vh auto;padding:38px;background:white;border:1px solid #dfe4df;border-radius:18px}h1{font-size:28px;line-height:1.3;margin:12px 0 18px}.eyebrow{font-size:12px;letter-spacing:.16em;color:#52715e}p{color:#58625a}button,select,a.action{font:inherit;padding:11px 18px;border:1px solid #ccd7cf;border-radius:9px;background:white;color:#203f2d;cursor:pointer}button.primary{background:#193f2c;color:white;border-color:#193f2c}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.status{background:#f1f5f1;padding:16px;border-radius:10px;white-space:pre-wrap}.small{font-size:13px;color:#68776c}a{color:#21623d}#result{white-space:pre-wrap}code{background:#f3f4f2;padding:2px 5px}
</style><main>
<div class="eyebrow">ZOTERO / PDF2ZH</div><h1>用 ChatGPT 订阅翻译论文</h1>
<p>连接你的 ChatGPT 账号，让本机 PDF2zh 使用账号中可用的订阅额度。论文文本会发送给 OpenAI；登录凭据在这台电脑上加密保存。</p>
<div id="status" class="status">正在检查连接…</div>
<div class="row"><button id="login" class="primary">Continue with ChatGPT</button><a class="action" href="https://chatgpt.com/settings/usage" target="_blank" rel="noopener noreferrer">管理用量</a></div>
<label for="models">翻译模型</label><div class="row"><select id="models" disabled><option>登录后加载可用模型</option></select><button id="test" disabled>测试一句翻译</button></div>
<label for="effort">推理强度</label><div class="row"><select id="effort" disabled><option value="default">默认（由模型决定）</option></select><span id="saved" role="status"></span></div>
<p class="small">选择后自动保存，对后续翻译请求生效。日常翻译可从“低”开始；已有翻译缓存不会因此重新翻译。</p>
<div id="result"></div>
<p class="small">Zotero 接口：<code>http://127.0.0.1:8766/v1</code><br>模型别名：<code>chatgpt-auto</code>（使用上方选择的模型）<br>登录成功不等于翻译成功，请完成一次测试后再翻译整篇论文。</p>
<p class="small"><a href="https://developers.openai.com/siwc/token-sharing-open-source" target="_blank" rel="noopener noreferrer">OpenAI 官方接入说明</a></p>
</main><script>
const csrf='__CSRF__';const $=id=>document.getElementById(id);let loaded=false,redirected=false;
const effortLabels={default:'默认（由模型决定）',none:'无推理',low:'低',medium:'中',high:'高',xhigh:'很高',max:'最高'};
function showEffort(d){$('effort').replaceChildren(...d.efforts.map(x=>new Option(effortLabels[x]||x,x)));$('effort').value=d.effort;$('effort').disabled=false;}
async function api(path,body){const r=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error?.message||'请求失败');return d;}
async function refresh(){try{const d=await api('/status');const s=d.session;const remaining=Math.max(0,Math.ceil((d.loginExpiresAt-Date.now())/1000));const waiting=`请在 OpenAI 页面完成登录和订阅额度授权。\n本次登录剩余 ${Math.floor(remaining/60)} 分 ${remaining%60} 秒，过期后请在这里重新发起。`;$('status').textContent=s.sharing?'已连接 · Using ChatGPT plan\n'+(s.identity?.email||''):(s.status==='connecting'?waiting:'尚未连接。请点击 Continue with ChatGPT。');$('test').disabled=!s.sharing;$('login').disabled=s.status==='connecting';if(d.loginError)$('status').textContent+='\n'+d.loginError.message;if(s.sharing&&!loaded){const m=await api('/models');$('models').replaceChildren(...m.models.map(x=>new Option(x.displayName,x.slug)));if(m.models.some(x=>x.slug===m.selected))$('models').value=m.selected;else{$('models').selectedIndex=0;await api('/model',{model:$('models').value});}$('models').disabled=false;loaded=true;}if(d.lastTest)$('result').textContent='测试成功：'+d.lastTest.text;else if(d.completedRequests>0)$('result').textContent='接口验证成功，已完成 '+d.completedRequests+' 次翻译请求。';}catch(e){$('status').textContent=e.message;}}
$('login').onclick=async()=>{try{redirected=false;await api('/login',{});await refresh();const timer=setInterval(async()=>{try{const d=await api('/login-url',{});if(d.error){clearInterval(timer);await refresh();}if(d.url&&!redirected){redirected=true;clearInterval(timer);location.href=d.url;}}catch(e){clearInterval(timer);$('status').textContent=e.message;}},500);}catch(e){$('status').textContent=e.message;}};
$('models').onchange=async()=>{try{showEffort(await api('/model',{model:$('models').value}));$('saved').textContent='已保存';}catch(e){$('saved').textContent=e.message;}};
$('effort').onchange=async()=>{const choice=$('effort').value;$('effort').disabled=true;try{showEffort(await api('/effort',{effort:choice}));$('saved').textContent='已保存：'+effortLabels[choice];}catch(e){$('saved').textContent='保存失败：'+e.message;try{showEffort(await api('/models'));}catch{}}finally{$('effort').disabled=false;}};
$('test').onclick=async()=>{$('test').disabled=true;$('result').textContent='正在翻译…';try{const d=await api('/test',{});$('result').textContent='测试成功：'+d.text;}catch(e){$('result').textContent='测试未通过：'+e.message;}finally{$('test').disabled=false;}};
refresh().then(async()=>{try{showEffort(await api('/models'));}catch{}});setInterval(refresh,5000);
</script></html>
